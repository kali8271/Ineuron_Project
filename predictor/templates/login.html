{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container" style="max-width: 400px; margin-top: 60px;">
    <div class="card p-4 shadow-sm">
        <h3 class="mb-3 text-center">Login</h3>
        <form method="post" action="">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label">Username</label>
                <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="Enter your username">
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label">Password</label>
                <input type="password" name="password" required class="form-control" id="id_password" placeholder="Enter your password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <div class="text-center mt-3">
            <span>Don't have an account?</span> <a href="{% url 'register' %}">Register</a>
        </div>
        {% if form.errors %}
        <div class="alert alert-danger mt-3">
            Invalid username or password. Please try again.
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
