{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="container" style="max-width: 400px; margin-top: 60px;">
    <div class="card p-4 shadow-sm">
        <h3 class="mb-3 text-center">Create an Account</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 mt-2">Register</button>
        </form>
        <div class="text-center mt-3">
            Already have an account? <a href="/accounts/login/">Login</a>
        </div>
    </div>
</div>
{% endblock %}
